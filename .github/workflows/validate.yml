name: Validate
on: [ push, pull_request ]
jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # brands: the domain is not in home-assistant/brands, which is
          # expected of a custom integration outside the HACS default store.
          # license: the check needs GitHub to recognise the license and it to
          # be OSI approved; CC BY-NC-SA 4.0 is neither. Both checks exist for
          # the default store only.
          ignore: brands license

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-test.txt
      - run: pytest
